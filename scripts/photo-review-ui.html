<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walk photo review</title>
  <style>
    :root { color: #23352c; background: #eee7dc; font: 16px/1.45 Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 20px 28px; border-bottom: 1px solid #cfc5b7; background: #f7f2e9; }
    h1 { margin: 2px 0 0; font: 500 clamp(1.3rem, 2.8vw, 2rem)/1.1 Georgia, serif; }
    .eyebrow, .meta { margin: 0; color: #6b756e; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
    .header-actions { display: flex; align-items: center; gap: 18px; }
    .progress { min-width: 190px; text-align: right; }
    .progress strong { display: block; font-size: 1.35rem; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: calc(100vh - 89px); }
    .stage { display: grid; place-items: center; min-width: 0; padding: 28px; background: #18231e; overflow: hidden; }
    .stage img { display: block; max-width: 100%; max-height: calc(100vh - 150px); object-fit: contain; transition: transform .18s ease; }
    aside { display: flex; flex-direction: column; gap: 19px; padding: 24px; background: #f7f2e9; }
    .facts { color: #647069; font-size: .82rem; }
    .facts p { margin: 4px 0; }
    .actions, .rotate, .navigation { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    button { min-height: 44px; border: 1px solid #aeb8b1; border-radius: 4px; background: #fff; color: inherit; cursor: pointer; }
    button:hover, button:focus-visible { border-color: #d7653f; outline: none; }
    button.selected { border-color: #254d3b; background: #dfeadf; box-shadow: inset 0 0 0 1px #254d3b; }
    button.reject.selected { border-color: #9e432e; background: #f3ded7; box-shadow: inset 0 0 0 1px #9e432e; }
    label { display: grid; gap: 7px; color: #4f5e56; font-size: .8rem; font-weight: 700; }
    input { width: 100%; padding: 10px; border: 1px solid #b9b2a7; border-radius: 4px; background: #fff; }
    .visibility { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .navigation { margin-top: auto; }
    .privacy { margin: 0; padding: 12px; border-left: 3px solid #d7653f; background: #efe5d7; color: #5d675f; font: italic .78rem/1.45 Georgia, serif; }
    .saved { min-height: 1.2em; color: #52715f; font-size: .76rem; text-align: center; }
    dialog { width: min(1180px, calc(100vw - 28px)); max-width: none; height: min(880px, calc(100vh - 28px)); padding: 0; border: 0; border-radius: 6px; background: #f7f2e9; color: inherit; box-shadow: 0 24px 80px rgb(0 0 0 / 42%); }
    dialog::backdrop { background: rgb(15 24 19 / 78%); }
    .contact-header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px 22px; border-bottom: 1px solid #d2c8b9; background: #f7f2e9; }
    .contact-header h2 { margin: 0; font: 500 1.45rem Georgia, serif; }
    .contact-filters { display: flex; flex-wrap: wrap; gap: 7px; padding: 14px 22px 0; }
    .contact-filters button { min-height: 36px; padding: 5px 12px; }
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 18px 22px 28px; }
    .contact-card { position: relative; min-height: 0; padding: 0; overflow: hidden; border-color: transparent; background: #19241f; text-align: left; }
    .contact-card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .contact-card span { position: absolute; right: 7px; bottom: 7px; padding: 3px 7px; border-radius: 999px; background: rgb(247 242 233 / 92%); color: #34473d; font-size: .65rem; font-weight: 800; text-transform: uppercase; }
    .contact-card[data-status="keep"] { box-shadow: inset 0 0 0 3px #65a87f; }
    .contact-card[data-status="reject"] { opacity: .55; }
    .contact-card[data-status="reject"] span { background: rgb(91 50 40 / 94%); color: #fff; }
    .contact-empty { padding: 40px; color: #667169; text-align: center; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } .stage { min-height: 52vh; } .stage img { max-height: 48vh; } }
  </style>
</head>
<body>
  <header>
    <div><p class="eyebrow">Private review workspace</p><h1 id="walk-name">Loading…</h1></div>
    <div class="header-actions">
      <button id="view-all" type="button">View all</button>
      <div class="progress"><strong id="position">—</strong><span id="summary">Finding candidates…</span></div>
    </div>
  </header>
  <main>
    <section class="stage"><img id="photo" alt="Candidate photograph"></section>
    <aside>
      <div class="facts"><p id="time"></p><p id="match"></p><p id="path"></p></div>
      <div class="actions">
        <button id="keep" type="button">✓ Yes, use it</button>
        <button id="reject" class="reject" type="button">✕ No, skip it</button>
      </div>
      <div class="visibility">
        <button id="public" type="button">Public</button>
        <button id="private" type="button">Login only</button>
      </div>
      <div class="rotate">
        <button id="left" type="button">↶ Rotate left</button>
        <button id="right" type="button">↷ Rotate right</button>
      </div>
      <label>Caption <input id="caption" type="text" placeholder="Optional caption"></label>
      <p class="privacy"><strong>Safe default:</strong> unreviewed photographs are shown nowhere. “Yes” starts as login-only. A photograph becomes public only when you explicitly choose Public. Nothing is published from this screen.</p>
      <p id="saved" class="saved" aria-live="polite"></p>
      <div class="navigation">
        <button id="previous" type="button">← Previous</button>
        <button id="next" type="button">Next →</button>
      </div>
    </aside>
  </main>
  <dialog id="contact-sheet" aria-labelledby="contact-title">
    <div class="contact-header">
      <div><p class="eyebrow">Compare the whole set</p><h2 id="contact-title">All candidate photographs</h2></div>
      <button id="contact-close" type="button">Close</button>
    </div>
    <div class="contact-filters" aria-label="Filter photographs">
      <button type="button" data-filter="all" class="selected">All</button>
      <button type="button" data-filter="unreviewed">Unreviewed</button>
      <button type="button" data-filter="keep">Selected</button>
      <button type="button" data-filter="reject">Skipped</button>
    </div>
    <div id="contact-grid" class="contact-grid"></div>
  </dialog>
  <script type="module">
    const session = await fetch('/api/session').then((response) => response.json())
    const { candidates, review, walk } = session
    let index = 0
    let contactFilter = 'all'
    const byId = review.decisions || {}
    const element = (id) => document.querySelector(`#${id}`)
    const controls = ['keep', 'reject', 'public', 'private']

    const decisionFor = (candidate) => byId[candidate.id] || {
      status: 'unreviewed', visibility: 'private', rotation: 0, caption: ''
    }

    const reviewedCount = () => Object.values(byId).filter((item) => item.status !== 'unreviewed').length
    const updateSummary = () => {
      const kept = Object.values(byId).filter((item) => item.status === 'keep').length
      element('summary').textContent = `${reviewedCount()} reviewed · ${kept} selected`
    }

    const statusLabel = (decision) => {
      if (decision.status === 'reject') return 'Skipped'
      if (decision.status === 'keep') return decision.visibility === 'public' ? 'Public' : 'Login only'
      return 'Unreviewed'
    }

    const renderContactSheet = () => {
      const visible = candidates
        .map((candidate, candidateIndex) => ({ candidate, candidateIndex, decision: decisionFor(candidate) }))
        .filter(({ decision }) => contactFilter === 'all' || decision.status === contactFilter)
      element('contact-grid').replaceChildren(...visible.map(({ candidate, candidateIndex, decision }) => {
        const button = document.createElement('button')
        button.type = 'button'
        button.className = 'contact-card'
        button.dataset.status = decision.status
        button.title = `${new Date(candidate.capturedAtIso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} · ${candidate.matchReason}`
        const image = document.createElement('img')
        image.src = `/media/${candidate.id}?size=thumb`
        image.alt = `Candidate ${candidateIndex + 1}`
        image.loading = 'lazy'
        image.style.transform = `rotate(${decision.rotation}deg)`
        const badge = document.createElement('span')
        badge.textContent = statusLabel(decision)
        button.append(image, badge)
        button.onclick = () => {
          index = candidateIndex
          element('contact-sheet').close()
          render()
        }
        return button
      }))
      if (!visible.length) {
        const empty = document.createElement('p')
        empty.className = 'contact-empty'
        empty.textContent = 'No photographs in this group yet.'
        element('contact-grid').replaceChildren(empty)
      }
    }

    const render = () => {
      const candidate = candidates[index]
      if (!candidate) return
      const decision = decisionFor(candidate)
      element('walk-name').textContent = walk.name
      element('position').textContent = `${index + 1} / ${candidates.length}`
      element('photo').src = `/media/${candidate.id}`
      element('photo').style.transform = `rotate(${decision.rotation}deg)`
      element('time').textContent = new Date(candidate.capturedAtIso).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })
      element('match').textContent = `${candidate.matchReason}${candidate.routeDistanceM == null ? '' : ` · ${candidate.routeDistanceM} m from route`}`
      element('path').textContent = candidate.archiveRelativePath
      element('caption').value = decision.caption || ''
      controls.forEach((id) => element(id).classList.remove('selected'))
      if (decision.status === 'keep') element('keep').classList.add('selected')
      if (decision.status === 'reject') element('reject').classList.add('selected')
      element(decision.visibility).classList.add('selected')
      element('previous').disabled = index === 0
      element('next').disabled = index === candidates.length - 1
      element('saved').textContent = ''
      updateSummary()
      if (element('contact-sheet').open) renderContactSheet()
    }

    const save = async (changes = {}) => {
      const candidate = candidates[index]
      const decision = { ...decisionFor(candidate), ...changes, id: candidate.id }
      byId[candidate.id] = decision
      render()
      const response = await fetch('/api/decision', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(decision)
      })
      if (!response.ok) throw new Error((await response.json()).error)
      element('saved').textContent = 'Saved privately'
    }

    element('keep').onclick = () => save({ status: 'keep' })
    element('reject').onclick = () => save({ status: 'reject' })
    element('public').onclick = () => save({ visibility: 'public' })
    element('private').onclick = () => save({ visibility: 'private' })
    element('left').onclick = () => save({ rotation: (decisionFor(candidates[index]).rotation + 270) % 360 })
    element('right').onclick = () => save({ rotation: (decisionFor(candidates[index]).rotation + 90) % 360 })
    element('caption').onchange = (event) => save({ caption: event.target.value })
    element('view-all').onclick = () => { renderContactSheet(); element('contact-sheet').showModal() }
    element('contact-close').onclick = () => element('contact-sheet').close()
    document.querySelectorAll('[data-filter]').forEach((button) => {
      button.onclick = () => {
        contactFilter = button.dataset.filter
        document.querySelectorAll('[data-filter]').forEach((candidate) => candidate.classList.toggle('selected', candidate === button))
        renderContactSheet()
      }
    })
    element('previous').onclick = () => { index -= 1; render() }
    element('next').onclick = () => { index += 1; render() }
    document.addEventListener('keydown', (event) => {
      if (event.target.tagName === 'INPUT') return
      if (event.key === 'ArrowLeft' && index > 0) { index -= 1; render() }
      if (event.key === 'ArrowRight' && index < candidates.length - 1) { index += 1; render() }
      if (event.key.toLowerCase() === 'y') save({ status: 'keep' })
      if (event.key.toLowerCase() === 'n') save({ status: 'reject' })
      if (event.key.toLowerCase() === 'p') save({ visibility: 'private' })
    })
    render()
  </script>
</body>
</html>
