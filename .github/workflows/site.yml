name: Sync and deploy walks

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      refresh_latest:
        description: Refresh the latest edited activity
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ashterism-walks-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled or ordinary manual sync
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.refresh_latest)
        run: npm run sync
        env:
          INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}

      - name: Refresh latest edited activity
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_latest
        run: npm run sync:latest
        env:
          INTERVALS_ICU_API_KEY: ${{ secrets.INTERVALS_ICU_API_KEY }}

      - name: Commit changed route data
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- data public/data)" ]; then
            echo "No route changes"
            exit 0
          fi

          git config user.name "Ashterism Walks sync"
          git config user.email "actions@users.noreply.github.com"
          git add data public/data
          git commit -m "Update Garmin walking routes"
          git push

      - name: Build the site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
